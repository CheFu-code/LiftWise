
name: Android Development Client

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dev-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Development APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      CI: "1"
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://api.chefu.co.za' }}
      EXPO_PUBLIC_ACCOUNT_APP_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_APP_URL || 'https://myaccount.chefu.co.za' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android Development Client
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload Development APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: liftwise-dev-client-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write installation instructions
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo "### LiftWise Android Development Client"
            echo ""
            echo "[Download APK artifact]($APK_ARTIFACT_URL)"
            echo ""
            echo "1. Extract the downloaded ZIP."
            echo "2. Install the APK on your Android device."
            echo "3. Start the Metro server:"
            echo ""
            echo '   npx expo start --dev-client'
            echo ""
            echo "4. Open LiftWise on your Android device."
            echo "5. Connect to your Metro development server."
            echo ""
            echo "This is a debug development client."
            echo "Metro is required to load JavaScript."
          } >> "$GITHUB_STEP_SUMMARY"
