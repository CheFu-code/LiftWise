
name: LiftWise Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CI: "1"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install Java without early Gradle caching
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Synchronize and install dependencies
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund

      # Generate native Android project if missing
      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Generating Android project..."
            npx expo prebuild \
              --platform android \
              --non-interactive
          else
            echo "Android project already exists."
          fi

      # Gradle cache only after native generation
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Validate signing secrets
      - name: Validate signing credentials
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing ANDROID_KEYSTORE_BASE64"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "::error::Missing ANDROID_KEY_ALIAS"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "::error::Missing ANDROID_KEY_PASSWORD"
            exit 1
          }

      # Restore the original signing keystore
      - name: Restore Android keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/liftwise-release.jks"

          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/liftwise-release.jks" \
            >> "$GITHUB_ENV"

      # Configure signing inside Gradle
      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("Android build.gradle not found")

          source = path.read_text()

          if "signingConfigs {" not in source:
              raise SystemExit("signingConfigs block not found")

          signing = """
          signingConfigs {
              release {
                  storeFile file(
                      System.getenv("ANDROID_KEYSTORE_FILE")
                  )
                  storePassword System.getenv(
                      "ANDROID_KEYSTORE_PASSWORD"
                  )
                  keyAlias System.getenv(
                      "ANDROID_KEY_ALIAS"
                  )
                  keyPassword System.getenv(
                      "ANDROID_KEY_PASSWORD"
                  )
              }
          """

          source = source.replace(
              "signingConfigs {",
              signing,
              1
          )

          head, separator, tail = source.partition(
              "buildTypes {"
          )

          if not separator:
              raise SystemExit("buildTypes block not found")

          match = re.search(
              r'\brelease\s*\{',
              tail
          )

          if not match:
              raise SystemExit("Release build type not found")

          before = tail[:match.end()]
          after = tail[match.end():]

          if "signingConfig signingConfigs.debug" in after:
              after = after.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
                  1
              )
          elif "signingConfig signingConfigs.release" not in after:
              after = (
                  "\n signingConfig signingConfigs.release\n"
                  + after
              )

          path.write_text(
              head + separator + before + after
          )

          print("Release signing configured.")
          PY

      # Prepare Gradle
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # Build both release formats
      - name: Build release APK and AAB
        working-directory: android
        run: |
          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # Collect final artifacts
      - name: Collect release artifacts
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/release/*.apk \
            release/LiftWise-release.apk

          cp android/app/build/outputs/bundle/release/*.aab \
            release/LiftWise-release.aab

          echo "Release files:"
          ls -lh release/

      # Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LiftWise-Release-APK
          path: release/LiftWise-release.apk
          retention-days: 30
          if-no-files-found: error

      # Upload AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: LiftWise-Release-AAB
          path: release/LiftWise-release.aab
          retention-days: 30
          if-no-files-found: error

      # Build summary
      - name: Build summary
        run: |
          echo "## LiftWise Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Both Android release formats built successfully." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed AAB" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download both from the Actions artifacts." \
            >> "$GITHUB_STEP_SUMMARY"
